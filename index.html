<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toño mi Pollo · Demo de plataforma</title>
<style>
:root{--y:#FFC62B;--yl:#FFE9A8;--o:#F4801A;--r:#D8321F;--ink:#2A1A0F;--mut:#7A6654;--cream:#FFF7E6;--card:#fff;--line:#F0DFC0;--ok:#1E8E5A;--okl:#DDF3E7;--navy:#1F2A44}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.bar{position:sticky;top:0;z-index:20;background:var(--y);border-bottom:3px solid var(--o);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--r);display:flex;align-items:center;justify-content:center;font-size:22px}
.brand b{display:block;font-size:17px;color:var(--r);font-weight:800;line-height:1.1}
.brand small{font-size:11px;color:var(--ink);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;border:2px solid var(--ink)}
.seg button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
main{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:24px;line-height:1.15;font-weight:800}
h2{font-size:18px;font-weight:800;margin:22px 0 10px}
h3{font-size:15px;font-weight:800}
.sub{color:var(--mut);margin-top:4px}
.eg{display:inline-block;background:var(--yl);border:1px dashed var(--o);color:#7a4a00;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;vertical-align:middle;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:14px}
.chip.on{background:var(--r);border-color:var(--r);color:#fff}
.prod{display:flex;flex-direction:column;gap:10px}
.prod .top{display:flex;gap:12px;align-items:flex-start}
.tile{width:54px;height:54px;border-radius:14px;background:var(--yl);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.prod .nm{font-weight:800;font-size:16px;line-height:1.2}
.prod .ds{color:var(--mut);font-size:13px}
.prod .pr{margin-left:auto;text-align:right;white-space:nowrap}
.prod .pr b{font-size:18px;color:var(--r)}
.prod .pr small{display:block;color:var(--mut);font-size:12px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qs>div{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.qs .step{align-self:flex-start}
.step{display:flex;align-items:center;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.step button{width:40px;height:38px;font-size:20px;font-weight:800}
.step button:active{background:var(--yl)}
.step span{min-width:30px;text-align:center;font-weight:800;color:var(--ink)}
.step.has{border-color:var(--ok);background:var(--okl)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--r);color:#fff;font-weight:800;padding:13px 18px;border-radius:14px;font-size:16px;width:100%}
.btn.alt{background:var(--ink)}

.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn.apple{background:#000}
.pay{border:2px solid var(--ok);border-radius:14px;padding:14px;margin-top:14px;display:grid;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--o)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ln small{display:block;color:var(--mut)}
.ln.tot{border:0;font-size:19px;font-weight:800;padding-top:10px}
.ln.dis{color:var(--ok);font-weight:700}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--r))}
.note{background:var(--yl);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.note.ok{background:var(--okl);color:#145c3b}
.toggle{display:flex;gap:6px;margin-top:8px}
.toggle button{flex:1;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13px}
.toggle button.on{border-color:var(--ok);background:var(--okl);color:#145c3b}
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px 14px;background:linear-gradient(180deg,rgba(255,247,230,0),var(--cream) 30%)}
#cartbar .in{max-width:1080px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:12px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.kpi b{font-size:22px}
.ord{border-left:6px solid var(--line)}

.st.s0{background:var(--r)}.st.s1{background:var(--o)}.st.s2{background:#b7791f}.st.s3{background:#2b6cb0}.st.s4{background:var(--ok)}.st.s5{background:#4a5568}
.items{font-size:13px;color:var(--mut);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.mbar{height:8px;border-radius:999px;background:var(--line);min-width:60px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.res{background:var(--navy);color:#fff;border-radius:14px;padding:14px;margin-top:12px}
.res b{font-size:28px;color:var(--y)}
.res small{display:block;opacity:.85}
.hbar{display:grid;grid-template-columns:110px 1fr 86px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.hbar .t{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--o)}
.hbar .t i.g{background:var(--ok)}
svg{max-width:100%;height:auto;display:block}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 16px 8px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hero{background:linear-gradient(135deg,var(--y),var(--o));border-radius:20px;padding:18px;color:var(--ink)}
.hero p{margin-top:6px;font-weight:600}
.stop{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.stop .nb{width:28px;height:28px;border-radius:50%;background:var(--r);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.stop small{color:var(--mut);display:block}
.stop .eta{margin-left:auto;font-weight:800;white-space:nowrap}
.q{display:flex;gap:10px;align-items:flex-start;margin:26px 0 4px}
.q i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--r);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.q h2{margin:2px 0 0}
.cin{width:78px;border:2px solid var(--o);border-radius:10px;padding:6px 8px;text-align:right;background:#fff;font-weight:700}
td small{color:var(--mut);display:block}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><div class="lg">🐔</div><div><b>Toño mi Pollo</b><small>Demo de plataforma</small></div></div>

<main id="app"></main>
<div id="cartbar"></div>
<div id="toast" role="status"></div>
<footer>Demo preparada por Aigora · Catálogo y precios reales del Excel "Arma tu pedido"; todo lo demás son datos de ejemplo.</footer>

<script>

const RAW = [
 [1,'semi','Empanadas','Empanadas de pechuga rellena','7 piezas',200,'pieza',35,'Pechuga',0.9,0.13,0.40,'🥟'],

 [4,'semi','Hamburguesas','Hamburguesas estilo de la casa','12 piezas',250,'pieza',25,'Pechuga',1.4,0.12,0.38,'🍔'],

 [6,'semi','Pechugas empanizadas','Pechuga empanizada con queso parmesano','6 piezas',200,'pieza',40,'Pechuga',0.9,0.15,0.38,'🧀'],

 [20,'fresco','Piernas','Piernas de pollo','20 piezas',200,'pieza',15,'Pierna y muslo',2.2,0.11,0.26,'🍗'],
 [21,'fresco','Pollo entero','Pollo entero, aprox. 3 kg; pídelo como quieras','1 pollo completo (aprox. 3 kg)',270,null,0,'Pollo entero',3,0,0.18,'🐓']
];
const P = RAW.map(r=>({id:r[0],cat:r[1],name:r[2],desc:r[3],pres:r[4],price:r[5],unit:r[6],uPrice:r[7],base:r[8],kg:r[9],uKg:r[10],margin:r[11],emo:r[12]}));
const CATS = {todos:'Todos',semi:'Semipreparados y promociones',fresco:'Frescos y por kilo'};

/* ===================== Datos de ejemplo ===================== */
const ZONES = {
  polanco:{n:'Polanco',days:[2],c:[19.433,-99.195]},
  napoles:{n:'Nápoles',days:[4],c:[19.393,-99.176]},
  azca:{n:'Azcapotzalco',days:[1,5],c:[19.487,-99.186]},
  valle:{n:'Del Valle',days:[4],c:[19.380,-99.165]}
};
const CHAPTERS = {
  fortuna:{n:'BNI Fortuna',day:3,c:[19.427,-99.168]},
  cap2:{n:'Capítulo Reforma (ejemplo)',day:4,c:[19.428,-99.160]},
  cap3:{n:'Capítulo Sur (ejemplo)',day:2,c:[19.360,-99.170]}
};
const DEPOT = [19.474,-99.180];
const STATUS = ['Nuevo','Confirmado','Preparado','En ruta','Entregado','Cobrado'];
const TIERS = [{min:3000,pct:0.08},{min:1500,pct:0.05}];
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ===================== Utilidades ===================== */
const $ = s=>document.querySelector(s);
const money = n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Math.round(n));
const num = (n,d=1)=>new Intl.NumberFormat('es-MX',{maximumFractionDigits:d}).format(n);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sod = d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso = d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fdate = s=>{const d=fromIso(s);return DOW[d.getDay()]+' '+d.getDate()+' de '+d.toLocaleDateString('es-MX',{month:'long'})};
const fshort = s=>{const d=fromIso(s);return DOW[d.getDay()].slice(0,3)+' '+d.getDate()+' '+d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')};
// Próxima fecha de entrega: el siguiente día de ruta cuyo corte (11 pm del día anterior) aún no pasa
function nextFor(days){const now=new Date();for(let i=1;i<=21;i++){const d=addDays(sod(now),i);if(days.includes(d.getDay())){const cut=addDays(d,-1);cut.setHours(23,0,0,0);if(now<cut)return iso(d)}}return iso(addDays(sod(now),7))}
const hash = s=>{let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%100003;return h};
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))*1.35}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}

/* ===================== Estado ===================== */
const S = {view:'tienda',cat:'todos',mode:'dom',cart:{},plan:'no',zone:'polanco',chapter:'fortuna',name:'',phone:'',addr:'',
  orders:[],seq:1041,tab:'pedidos',focus:null,lastId:null,sent:null,err:'',paying:false,bniPay:'sesion',
  standing:[{name:'Pechuga congelada',kg:400,price:80,base:'Pechuga congelada'},{name:'Pierna y muslo congelados',kg:60,price:74,base:'Pierna y muslo congelados'}],
  customers:[
    {n:'Familia Girasol',canal:'Menudeo',zona:'Polanco',freq:'Semanal',last:6,ticket:640},
    {n:'Familia Limón',canal:'Menudeo',zona:'Polanco',freq:'Semanal',last:6,ticket:820},
    {n:'Familia Sakura',canal:'Menudeo',zona:'Polanco',freq:'Semanal',last:6,ticket:510},
    {n:'Familia Jacaranda',canal:'Menudeo',zona:'Nápoles',freq:'Quincenal',last:11,ticket:560},
    {n:'Edificio Ejemplo',canal:'Menudeo',zona:'Nápoles',freq:'Semanal',last:4,ticket:470},
    {n:'Familia Nogal',canal:'Menudeo',zona:'Azcapotzalco',freq:'Semanal',last:3,ticket:390},
    {n:'Familia Canela',canal:'Menudeo',zona:'Azcapotzalco',freq:'Semanal',last:3,ticket:450},
    {n:'Dark kitchen (ejemplo)',canal:'Mayoreo',zona:'Nápoles',freq:'Semanal',last:5,ticket:7400},
    {n:'Comedor (ejemplo)',canal:'Mayoreo',zona:'Otra',freq:'Semanal',last:2,ticket:36440},
    {n:'Socio 1 (ejemplo)',canal:'BNI',zona:'Del Valle',freq:'Quincenal',last:13,ticket:470},
    {n:'Socio 2 (ejemplo)',canal:'BNI',zona:'Del Valle',freq:'Quincenal',last:13,ticket:620},

    {n:'Familia Mango',canal:'Menudeo',zona:'Del Valle',freq:'Quincenal',last:24,ticket:500},
    {n:'Familia Cielo',canal:'Menudeo',zona:'Condesa',freq:'Mensual',last:31,ticket:420},
    {n:'Familia Río',canal:'Menudeo',zona:'Del Valle',freq:'Quincenal',last:9,ticket:580}
  ]
};
const prod = id=>P.find(p=>p.id===id);
function lineOf(p,c){const parts=[];if(c.p)parts.push(c.p+' × '+p.pres);if(c.u)parts.push(c.u+' × '+p.unit);return {pid:p.id,name:p.name,p:c.p,u:c.u,label:parts.join(' + '),total:c.p*p.price+c.u*p.uPrice,base:p.base,kg:c.p*p.kg+c.u*p.uKg}}
function mkOrder(o){const id=++S.seq;const lines=o.items.map(it=>it.pid?lineOf(prod(it.pid),{p:it.p||0,u:it.u||0}):it);const sub=lines.reduce((a,l)=>a+l.total,0);const disc=o.disc||0,fee=o.fee||0;const ord={id,name:o.name,phone:o.phone||'',channel:o.channel,zone:o.zone||null,chapter:o.chapter||null,addr:o.addr||'',date:o.date,lines,sub,disc,fee,total:sub-disc+fee,status:o.status||0,plan:o.plan||'no',pay:o.pay||(o.channel==='Tienda'?'tarjeta':o.channel==='Mayoreo'?'credito':'entrega'),isNew:!!o.isNew};S.orders.push(ord);return ord}
function seed(){
  Object.values(CHAPTERS).forEach(c=>c.date=nextFor([c.day])); // fecha de la próxima sesión presencial; Toño la cambia en Panel > BNI

function tabRuta(day){
  const list=day.filter(open);let stops=[];
  list.filter(o=>o.zone).forEach(o=>{const c=ZONES[o.zone].c,hh=hash(o.id+o.name);stops.push({name:o.name,sub:(o.addr||ZONES[o.zone].n)+' · '+money(o.total),c:[c[0]+((hh%200)-100)/8000,c[1]+(((hh>>3)%200)-100)/8000]})});
  const bni=list.filter(o=>o.chapter);if(bni.length){const ch=CHAPTERS[bni[0].chapter];stops.push({name:'Sesión '+ch.n,sub:bni.length+' pedidos · '+money(bni.reduce((a,o)=>a+o.total,0)),c:ch.c})}
  let h=`<h2>Ruta del ${fdate(S.focus)}</h2>`;
  if(!stops.length)return h+`<div class="card"><p class="sub">Los pedidos de esta fecha se entregan en sitio; no hay ruta a domicilio.</p></div>`;
  const dist=seq=>{let d=0,prev=DEPOT;seq.forEach(s=>{d+=km(prev,s.c);prev=s.c});return d+km(prev,DEPOT)};
  const rest=[...stops],opt=[];let cur=DEPOT;while(rest.length){let bi=0,bd=1e9;rest.forEach((s,i)=>{const d=km(cur,s.c);if(d<bd){bd=d;bi=i}});const s=rest.splice(bi,1)[0];opt.push(s);cur=s.c}
  const dO=dist(opt);
  let t=8*60,prev=DEPOT;opt.forEach(s=>{t+=km(prev,s.c)/22*60;s.eta=t;t+=7;prev=s.c});
  const hm=m=>{m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
  const back=t+km(prev,DEPOT)/22*60,dur=Math.round(back-480),durTxt=(dur>=60?Math.floor(dur/60)+' h ':'')+(dur%60)+' min';
  const pts=[DEPOT,...opt.map(s=>s.c)],la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]);const mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo);
  const X=p=>30+(mxO===mnO?130:(p[1]-mnO)/(mxO-mnO)*260),Y=p=>205-(mxA===mnA?90:(p[0]-mnA)/(mxA-mnA)*180);
  h+=`<div class="kpis" style="margin:0 0 12px"><div class="kpi"><small>Paradas</small><b>${opt.length}</b></div><div class="kpi"><small>Recorrido</small><b>${num(dO)} km</b></div><div class="kpi"><small>Tiempo en ruta</small><b>${durTxt}</b></div><div class="kpi"><small>Regreso estimado</small><b>${hm(back)}</b></div></div>`;
  h+=`<div class="grid"><div class="card"><svg viewBox="0 0 320 230" role="img" aria-label="Esquema de la ruta"><rect x="1" y="1" width="318" height="228" rx="14" fill="#FFF7E6" stroke="#F0DFC0"/><polyline points="${[...pts,DEPOT].map(p=>X(p)+','+Y(p)).join(' ')}" fill="none" stroke="#D8321F" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 4"/><rect x="${X(DEPOT)-9}" y="${Y(DEPOT)-9}" width="18" height="18" rx="4" fill="#1F2A44"/><text x="${X(DEPOT)}" y="${Y(DEPOT)+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">S</text>${opt.map((s,i)=>`<circle cx="${X(s.c)}" cy="${Y(s.c)}" r="11" fill="#D8321F"/><text x="${X(s.c)}" y="${Y(s.c)+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${i+1}</text>`).join('')}</svg><p class="sub" style="font-size:12px">Esquema de ejemplo con ubicaciones aproximadas. S = punto de salida. En la plataforma real la ruta sale sobre el mapa y se abre en Google Maps o Waze.</p></div><div class="card"><h3>Orden de entrega</h3><div class="stop"><div class="nb" style="background:var(--navy)">S</div><div><b>Salida</b><small>Producto en hielera, cadena de frío</small></div><div class="eta">8:00</div></div>${opt.map((s,i)=>`<div class="stop"><div class="nb">${i+1}</div><div><b>${esc(s.name)}</b><small>${esc(s.sub)}</small></div><div class="eta">${hm(s.eta)}</div></div>`).join('')}</div></div>`;
  return h;
}

  h+=`<div class="q"><i>3</i><div><h2>¿Qué me va a sobrar?</h2><p class="sub">Si compras pollo entero para sacar pechuga, también te llega pierna y muslo. Aquí ves si ya la tienes vendida. <span class="eg">rendimientos de ejemplo</span></p></div></div>`;

function calc(){
  const v=id=>parseFloat(($('#'+id)||{}).value)||0;const c=v('c1'),k=v('c2'),m=Math.max(0,Math.min(90,v('c3')))/100,e=v('c4'),n=v('c5'),ask=v('c6');const el=$('#calcres');if(!el)return;
  if(k<=0){el.innerHTML='<small>Escribe los kilos por semana.</small>';return}
  const full=c+e*n/k,price=full/(1-m),u=(ask-full)*k;
  el.innerHTML=`<small>Para ganar ${num(m*100)}%, véndelo a</small><b>${money2(price)} el kilo</b><small style="margin-top:4px">Cada kilo te cuesta ${money2(full)} ya con la entrega. Te quedan ${money((price-full)*k)} a la semana.</small>${ask>0?`<small style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.3)">Si se lo das a ${money2(ask)}, como te lo piden</small><b style="${u<0?'color:#FF9C8F':''}">${u<0?'pierdes':'te quedan'} ${money(Math.abs(u))} a la semana</b><small style="margin-top:4px">${u<0?'Ese precio está abajo de tu costo.':'Ganas '+num((ask-full)/ask*100)+'% de lo que cobras.'}</small>`:''}`;
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  ({tienda:renderTienda,mayoreo:renderMayoreo,panel:renderPanel})[S.view]();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const {act,id,k,v}=b.dataset;
  if(act==='view'){S.view=v;render();window.scrollTo(0,0);return}
  if(act==='cat'){S.cat=v}
  else if(act==='inc'||act==='dec'){const c=S.cart[id]=S.cart[id]||{p:0,u:0};c[k]=Math.max(0,Math.min(100,c[k]+(act==='inc'?1:-1)));S.sent=null;S.err='';S.paying=false}
  else if(act==='plan'){S.plan=v;S.paying=false}
  else if(act==='mode'){S.mode=v;S.paying=false}
  else if(act==='bnipay'){S.bniPay=v;S.paying=false}
  else if(act==='pay'){send(v);return}
  else if(act==='payback'){S.paying=false}
  else if(act==='tocart'){const el=$('#pedido');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  else if(act==='send'){send();return}
  else if(act==='again'){S.sent=null}
  else if(act==='gopanel'){S.view='panel';S.tab='pedidos';S.sent=null;render();window.scrollTo(0,0);return}
  else if(act==='tab'){S.tab=v;if(v==='ruta')bestRouteDate()}
  else if(act==='allcost'){S.allCost=!S.allCost}
  else if(act==='focus'){S.focus=v}
  else if(act==='adv'){const o=S.orders.find(o=>o.id===+id);if(o&&o.status<5){o.status++;o.isNew=false;toast('Pedido #'+o.id+': '+STATUS[o.status].toLowerCase())}}
  else if(act==='wadd'){const nm=$('#wname').value.trim(),q=Math.max(1,parseInt($('#wqty').value)||1),z=$('#wzone').value,pid=+$('#wprod').value;if(!nm){toast('Escribe el nombre del cliente');$('#wname').focus();return}S.orders.forEach(o=>o.isNew=false);const o=mkOrder({name:nm,channel:'WhatsApp',zone:z,date:nextFor(ZONES[z].days),items:[{pid,p:q}],isNew:true});S.focus=o.date;toast('Pedido #'+o.id+' registrado para el '+fshort(o.date))}
  else if(act==='mkg'){const s=S.standing[+id];s.kg=Math.max(0,s.kg+(+v))}
  else if(act==='msave'||act==='mpause'){const o=S.orders.find(o=>o.id===S.standingId);if(act==='mpause'){o.lines=[];o.sub=0;o.total=0;o.status=5;toast('Semana pausada. Toño ya lo ve en su panel.')}else{o.lines=standingItems();o.sub=o.total=o.lines.reduce((a,l)=>a+l.total,0);o.status=1;toast('Cambios guardados. Toño ya los ve en su panel.')}}
  render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.calc){calc();return}if(t.dataset.cost){const p=prod(+t.dataset.cost);p.cost=Math.max(0,parseFloat(t.value)||0);const c=costCells(p);$('#cg'+p.id).innerHTML=c[0];$('#ck'+p.id).innerHTML=c[1];$('#costtip').innerHTML=costTip();return}if(t.dataset.f&&!t.dataset.re){S[t.dataset.f]=t.value}});

// Enlaces directos: index.html#panel, #mayoreo, #panel-ruta, #panel-costeo...
(function(){const h=location.hash.replace('#','').split('-');if(['tienda','mayoreo','panel'].includes(h[0]))S.view=h[0];if(h[1]&&TABS.some(t=>t[0]===h[1]))S.tab=h[1]})();
// Al abrir Ruta, si la fecha elegida tiene menos de 2 paradas a domicilio, salta a la fecha con más paradas
function bestRouteDate(){const n=d=>S.orders.filter(o=>o.date===d&&open(o)&&o.zone).length;if(n(S.focus)>=2)return;const best=allDates().sort((a,b)=>n(b)-n(a))[0];if(n(best)>=2)S.focus=best}
seed();if(S.tab==='ruta')bestRouteDate();render();
</script>
</body>
</html>
